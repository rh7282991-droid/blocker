name: Build Extension

on:
  push:
    branches:
      - feat/redirect-rules
      - feat/foundation-architecture
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - feat/foundation-architecture
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build & Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Print environment info
        run: |
          echo "Node: $(node --version)"
          echo "npm:  $(npm --version)"
          echo "Working dir: $(pwd)"
          echo "Files:"
          ls -la
          echo "package.json:"
          cat package.json

      - name: Install dependencies
        run: |
          set -e
          npm install --legacy-peer-deps --no-audit --no-fund 2>&1 | tail -100

      - name: Build extension
        run: npm run build 2>&1 | tail -200

      - name: Verify build output
        run: |
          if [ ! -d "dist" ]; then
            echo "Build failed: dist/ folder not created"
            exit 1
          fi
          echo "Build artifacts:"
          ls -la dist/
          echo "Manifest in dist:"
          cat dist/manifest.json || echo "No manifest in dist!"

      - name: Create ZIP archive
        run: |
          cd dist
          zip -r ../focusos-extension.zip .
          cd ..
          echo "ZIP created:"
          ls -lh focusos-extension.zip

      - name: Upload ZIP as artifact
        uses: actions/upload-artifact@v4
        with:
          name: focusos-extension-${{ github.sha }}
          path: focusos-extension.zip
          retention-days: 30

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: focusos-extension.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
