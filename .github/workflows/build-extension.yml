name: Build Extension

on:
  push:
    branches:
      - feat/redirect-rules
      - feat/foundation-architecture
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - feat/foundation-architecture
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Print environment info
        run: |
          echo "Node: $(node --version)"
          echo "npm:  $(npm --version)"
          ls -la

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build extension
        run: npm run build

      - name: Verify build output
        run: |
          if [ ! -d "dist" ]; then
            echo "Build failed: dist/ folder not created"
            exit 1
          fi
          echo "Build artifacts:"
          ls -la dist/
          echo "Final manifest.json:"
          cat dist/manifest.json

      - name: Create ZIP archive
        run: |
          cd dist
          zip -r ../focusos-extension.zip .
          cd ..
          ls -lh focusos-extension.zip

      - name: Upload ZIP as artifact
        uses: actions/upload-artifact@v4
        with:
          name: focusos-extension-${{ github.sha }}
          path: focusos-extension.zip
          retention-days: 30

      - name: Create or update rolling Release (on branch push)
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-${{ github.ref_name }}
          name: "FocusOS Latest Build (${{ github.ref_name }})"
          body: |
            Auto-built from branch `${{ github.ref_name }}` at commit ${{ github.sha }}.

            **Install instructions:**
            1. Download `focusos-extension.zip` below
            2. Extract the ZIP
            3. Open `chrome://extensions/`
            4. Enable "Developer mode" (top-right)
            5. Click "Load unpacked" and select the extracted folder
          files: focusos-extension.zip
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create stable Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: focusos-extension.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
